<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Welcome to DELTARUNE. Play the game and watch trailers from Chapters 1–5."
    />
    <meta name="theme-color" content="#090a12" />
    <title>Welcome to DELTARUNE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="welcome" aria-labelledby="welcome-title">
        <div class="welcome-copy">
          <p class="eyebrow">A tale of dark and light</p>
          <h1 id="welcome-title">Welcome to<br />DELTARUNE</h1>
        </div>
        <a
          class="play-button"
          href="https://store.steampowered.com/app/1671210/DELTARUNE/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="play-icon" aria-hidden="true">▶</span>
          <span>Play</span>
        </a>
      </section>

      <section class="trailers" aria-labelledby="trailers-title">
        <div class="section-heading">
          <p class="eyebrow">See what awaits</p>
          <h2 id="trailers-title">Chapter trailers</h2>
        </div>

        <div class="trailer-grid">
          <a
            class="trailer-card chapter-one"
            href="https://www.youtube.com/results?search_query=DELTARUNE+Chapter+1+official+trailer"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Find the DELTARUNE Chapter 1 trailer on YouTube"
          >
            <span class="chapter-number">01</span>
            <span class="trailer-play" aria-hidden="true">▶</span>
            <span class="chapter-label">Chapter 1</span>
          </a>
          <a
            class="trailer-card chapter-two"
            href="https://www.youtube.com/results?search_query=DELTARUNE+Chapter+2+official+trailer"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Find the DELTARUNE Chapter 2 trailer on YouTube"
          >
            <span class="chapter-number">02</span>
            <span class="trailer-play" aria-hidden="true">▶</span>
            <span class="chapter-label">Chapter 2</span>
          </a>
          <a
            class="trailer-card chapter-three"
            href="https://www.youtube.com/results?search_query=DELTARUNE+Chapter+3+official+trailer"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Find the DELTARUNE Chapter 3 trailer on YouTube"
          >
            <span class="chapter-number">03</span>
            <span class="trailer-play" aria-hidden="true">▶</span>
            <span class="chapter-label">Chapter 3</span>
          </a>
          <a
            class="trailer-card chapter-four"
            href="https://www.youtube.com/results?search_query=DELTARUNE+Chapter+4+official+trailer"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Find the DELTARUNE Chapter 4 trailer on YouTube"
          >
            <span class="chapter-number">04</span>
            <span class="trailer-play" aria-hidden="true">▶</span>
            <span class="chapter-label">Chapter 4</span>
          </a>
          <a
            class="trailer-card chapter-five"
            href="https://www.youtube.com/results?search_query=DELTARUNE+Chapter+5+official+trailer"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Find the DELTARUNE Chapter 5 trailer on YouTube"
          >
            <span class="chapter-number">05</span>
            <span class="trailer-play" aria-hidden="true">▶</span>
            <span class="chapter-label">Chapter 5</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
